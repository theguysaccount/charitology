<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charitology: before you give</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="22" height="22" alt="" />
      <strong>Before you give</strong>
    </header>
    <form id="lookup">
      <label for="q">Look up this organization or cause</label>
      <div class="row">
        <input id="q" type="text" autocomplete="off" spellcheck="false" />
        <button type="submit">Look up</button>
      </div>
      <p class="hint">Opens Charitology’s lookup, which links to the open registries. Nothing is sent until you click.</p>
    </form>
    <h2>The Giver’s Checklist</h2>
    <ol id="checklist"></ol>
    <footer>
      <span id="count">0 of 10 answered</span>
      <a id="method" href="#" target="_blank" rel="noopener">Why these questions</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
