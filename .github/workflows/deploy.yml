name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_base_sha:
        description: Exact previous publication commit SHA available in this repository
        required: true
        type: string

      observations_base_sha:
        description: Exact previous observation commit SHA available in this repository
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  charity-os:
    name: Shared OS checks
    permissions:
      contents: read
    uses: ./.github/workflows/charity-os-check.yml

  newsletter:
    name: Newsletter safety checks
    permissions:
      contents: read
    uses: ./.github/workflows/newsletter-check.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - name: Verify exact committed publication history
        run: npm run check:publication-history
      - name: Verify exact committed observation history
        run: npm run check:observations-history
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check content and links
        run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: [build, newsletter, charity-os]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
