name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  charity-os:
    name: Shared OS checks
    permissions:
      contents: read
    uses: ./.github/workflows/charity-os-check.yml

  newsletter:
    name: Newsletter safety checks
    permissions:
      contents: read
    uses: ./.github/workflows/newsletter-check.yml

  model-reference:
    name: Strict model reference checks
    permissions:
      contents: read
    uses: ./.github/workflows/model-reference-check.yml

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - name: Verify immutable model bytes without claiming runtime conformance
        run: node scripts/generate-model-engine-registry.mjs --check-integrity
      - name: Qualify the exact measured Linux model runtime
        run: node scripts/check-model-runtime.mjs
      - name: Verify exact committed publication history
        run: npm run check:publication-history
      - name: Verify exact committed observation history
        run: npm run check:observations-history
      - name: Verify exact committed directory Resource history
        run: npm run check:directory-resources-history
      - name: Verify exact committed Disaster Desk history
        run: npm run check:disasters-history
      - name: Build (validates every entry against its schema)
        run: npm run build
      - name: Check content cross-references and links
        run: npm run check
