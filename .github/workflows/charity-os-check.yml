name: Charity OS checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charity-os:
    name: Unit, browser-model and isolated Postgres tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/charity-os
    env:
      # Disposable service-container credentials. No provider or production secrets.
      DATABASE_URL: postgresql://os_test_owner:ci-owner-only-password@127.0.0.1:5432/charitology_os_ci
      OS_DATABASE_URL: postgresql://os_test_app:ci-app-only-password@127.0.0.1:5432/charitology_os_ci
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: charitology_os_ci
          POSTGRES_USER: os_test_owner
          POSTGRES_PASSWORD: ci-owner-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U os_test_owner -d charitology_os_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/charity-os/package-lock.json
      - name: Install locked native-source compiler dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci
      - name: Install locked OS dependencies
        run: npm ci
      - name: Check browser entry syntax and execute server/browser-model regressions
        run: |
          node --check public/app.js
          node --check public/intake.js
          node --check public/participant.js
          node --check public/participation.js
          node --check public/learning.js
          npm test
      - name: Create a separate constrained application role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE os_test_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS PASSWORD 'ci-app-only-password';
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT CONNECT ON DATABASE charitology_os_ci TO os_test_app;
          CREATE ROLE os_checkin_ci_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION BYPASSRLS PASSWORD 'ci-checkin-owner-only-password';
          GRANT CONNECT,CREATE ON DATABASE charitology_os_ci TO os_checkin_ci_owner;
          CREATE ROLE os_group_ci_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION BYPASSRLS PASSWORD 'ci-group-owner-only-password';
          GRANT CONNECT,CREATE ON DATABASE charitology_os_ci TO os_group_ci_owner;
          CREATE ROLE os_field_ci_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION BYPASSRLS PASSWORD 'ci-field-owner-only-password';
          GRANT CONNECT,CREATE ON DATABASE charitology_os_ci TO os_field_ci_owner;
          CREATE ROLE os_crm_ci_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION BYPASSRLS PASSWORD 'ci-crm-owner-only-password';
          GRANT CONNECT,CREATE ON DATABASE charitology_os_ci TO os_crm_ci_owner;
          CREATE ROLE os_recurrence_ci_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION BYPASSRLS PASSWORD 'ci-recurrence-owner-only-password';
          GRANT CONNECT,CREATE ON DATABASE charitology_os_ci TO os_recurrence_ci_owner;
          SQL
      - name: Exercise real Postgres, Better Auth and tenant workflows
        # The fixture migrates a random temporary schema with the owner, grants
        # only data/sequence access to os_test_app, asserts no superuser/BYPASSRLS,
        # uses synthetic recipients and a mocked mailer, and drops its schema.
        # Do not use npm run test:db: that local command loads private .env.local.
        run: node --test --test-concurrency=1 test-db/*.test.mjs
      - name: Exercise participant check-in using the closed PG17 CI profile
        env:
          CHECKIN_TEST_PROFILE: github-pg17-v1
        run: node --test --test-concurrency=1 test-db/participant-check-in.ci17.mjs
      - name: Exercise atomic group bookings using the closed PG17 CI profile
        env:
          GROUP_TEST_PROFILE: github-group-pg17-v1
        run: node --test --test-concurrency=1 test-db/participation-groups.ci17.mjs
      - name: Exercise aggregate FIELD imports using the closed PG17.11 CI profile
        env:
          FIELD_TEST_PROFILE: github-field-pg17-v1
        run: node --test --test-concurrency=1 test-db/field-responses.ci17.mjs
      - name: Exercise contact reconciliation using the closed PG17.11 CI profile
        env:
          CRM_TEST_PROFILE: github-crm-pg17-v1
        run: node --test --test-concurrency=1 test-db/contact-reconciliation.ci17.mjs
      - name: Exercise finite occurrence drafts using the closed PG17.11 CI profile
        env:
          RECURRENCE_TEST_PROFILE: github-recurrence-pg17-v1
          RECURRENCE_RESULTS_ROOT: ${{ runner.temp }}
        run: |
          node --input-type=module <<'JS'
          import { runRecurrenceCi17 } from './test-db/participation-recurrence.ci17.mjs';
          await runRecurrenceCi17();
          JS
