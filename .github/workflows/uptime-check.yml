name: Production Health Check

on:
  schedule:
    # Run every 6 hours at minute 17 UTC to monitor live production surfaces.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-check
  cancel-in-progress: false

jobs:
  health:
    name: Verify live production endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Run synthetic read-only production health checks
        run: node scripts/check-production-health.mjs
