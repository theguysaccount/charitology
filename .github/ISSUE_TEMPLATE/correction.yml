name: Correction
description: Something on a page is wrong, outdated or unsourced.
labels: [correction]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the sentence and explain the problem.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: A link to a source that shows the correct information.
